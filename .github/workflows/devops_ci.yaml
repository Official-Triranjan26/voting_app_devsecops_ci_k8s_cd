name: voter_app_devops_ci
on: 
  push:
    branches: [features/devops_ci]
  workflow_dispatch:
jobs: 
  validate-vote :
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vote
    steps:
      - name: checkout sourcecode
        uses: actions/checkout@v7 

      - name: setup python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vote/requirements-dev.txt

      - name: install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
      - name: Unit tests
        run: python -m pytest unit_testcases/
  validate-result :
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: result
    steps:
      - name: checkout sourcecode
        uses: actions/checkout@v7 

      - name: setup node 18
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: result/package-lock.json

      - name: install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test